<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Foto Profil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">
        <div class="card-header">
            <img src="https://via.placeholder.com/120" alt="Foto Profil" class="profile-img">
        </div>
        <div class="card-body">
            <h2 class="name">Jannatin</h2>
            <p class="title">Web Developer & Designer</p>
            <p class="bio">Halo! Saya suka membuat halaman web yang menarik dan interaktif.</p>
            
            <div class="social-links">
                <a href="#" class="btn">Instagram</a>
                <a href="#" class="btn">GitHub</a>
                <a href="#" class="btn">LinkedIn</a>
            </div>
        </div>
    </div>

</body>
</html>
